[workspace]
members = [
    "crates/pixus-core",
    "crates/pixus-macro",
    "crates/pixus-template-provider",
    "examples/dioxus-basic",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/pixelscortex/pixus"

[workspace.dependencies]
anyhow = "1"
proc-macro2 = "1"
quote = "1"
rstml = "0.12.1"
syn = { version = "2", features = ["full", "extra-traits"] }
